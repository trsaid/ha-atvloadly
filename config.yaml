name: ATVLoadly
version: "1.0.11"
slug: atvloadly
description: Apple TV sideload server
url: "https://github.com/trsaid/ha-atvloadly"

startup: services
boot: auto

init: false

arch:
  - aarch64
  - armv7
  - amd64

host_network: true

usb: true

privileged:
  - SYS_ADMIN

ports:
  "5533/tcp": 5533
ports_description:
  "5533/tcp": "ATVLoadly Web Interface"

ingress: true
ingress_port: 5533

panel_icon: "mdi:apple"
panel_title: "ATVLoadly"

webui: "http://[HOST]:[PORT:5533]"

map:
  - config:rw

environment:
  SERVICE_PORT: "5533"

options: {}
schema: {}